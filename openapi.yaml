openapi: 3.0.3
info:
  title: hamon API
  description: Java + Oracle のシステムを対象にした「確率つき影響調査」の API
  version: 0.1.0
servers:
  - url: /api
paths:
  /impact:
    get:
      tags: [impact]
      operationId: surveyImpact
      summary: 指定したノードを変更したときの影響範囲
      parameters:
        - name: target
          in: query
          required: true
          description: 変更するノード（クラス#メソッド、テーブル.カラム など）
          schema:
            type: string
            minLength: 1
          example: com.example.order.OrderService#cancel
        - name: minProbability
          in: query
          description: この確率未満の候補は返さない（漏れの許容度）
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
            default: 0.05
      responses:
        "200":
          description: 影響を受ける候補（確からしさの高い順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImpactItem"
        "400":
          description: パラメータ不正
  /nodes:
    get:
      tags: [nodes]
      operationId: searchNodes
      summary: 名前の一部でノードを探す（変更点の入力補完用）
      parameters:
        - name: q
          in: query
          required: true
          description: 名前に含まれる文字列（大文字小文字を区別しない）
          schema:
            type: string
            minLength: 1
          example: cancel
        - name: limit
          in: query
          description: 返す件数の上限
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 名前の短い順に並べた一致ノード
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeSummary"
        "400":
          description: パラメータ不正
  /analysis:
    post:
      tags: [analysis]
      operationId: analyzeSources
      summary: 設定されたソース（hamon.analysis.source-roots）を解析し、依存グラフを作り直す
      responses:
        "200":
          description: 作り直したグラフの大きさ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
components:
  schemas:
    AnalysisResult:
      type: object
      required: [nodeCount, edgeCount]
      properties:
        nodeCount:
          type: integer
          description: ノード数
        edgeCount:
          type: integer
          description: 辺の数
    NodeKind:
      type: string
      description: ノードの種類（GLOSSARY「ノード」）
      enum: [METHOD, CLASS, FILE, TABLE, COLUMN, CONFIG]
    NodeSummary:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          example: com.example.order.OrderService#cancel
        kind:
          $ref: "#/components/schemas/NodeKind"
    ImpactItem:
      type: object
      required: [node, kind, probability, path]
      properties:
        node:
          type: string
          description: 影響を受ける候補のノード
          example: com.example.batch.OrderCancelJob#run
        kind:
          $ref: "#/components/schemas/NodeKind"
        probability:
          type: number
          format: double
          description: 影響を受ける確からしさ（0〜1）。経路上の辺の確率の積
          example: 0.72
        path:
          type: array
          description: 変更点からこのノードへ至る経路（先頭が変更点、末尾がこのノード）
          items:
            type: string
          example: ["com.example.order.OrderService#cancel", "com.example.batch.OrderCancelJob#run"]
