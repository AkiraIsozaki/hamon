spring:
  application:
    name: hamon
  profiles:
    # データアクセスの実装を選ぶ（ADR-0001）。mybatis / datajdbc。
    # 切り替えは --spring.profiles.active=datajdbc（既定値はここ）
    default: mybatis
  # DB 接続情報は環境変数 SPRING_DATASOURCE_URL / USERNAME / PASSWORD（compose.yaml）で渡す。ここには書かない

management:
  endpoint:
    health:
      # /actuator/health に db などコンポーネントごとの状態を出す（Oracle 接続確認に使う）
      show-details: always

mybatis:
  configuration:
    # SELECT の列名 node_path を Java の nodePath に対応させる
    map-underscore-to-camel-case: true
    # 結果行を record のコンストラクタ引数名で組み立てる（引数名は Boot の Gradle プラグインが -parameters で残す）
    arg-name-based-constructor-auto-mapping: true
